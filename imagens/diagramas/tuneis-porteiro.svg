<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Porteiro (bastion) e túneis SSM</title>
  <desc id="d">Do PC, localhost:5433 e localhost:3002 passam pelo AWS Session Manager até o porteiro, que não tem porta de entrada aberta. O porteiro repassa para o RDS na 5432, que é privado, e para a EC2 do cluster ECS na porta 80. O acesso direto do PC ao RDS é bloqueado.</desc>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FA8"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A21CAF"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="580" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#232F3E">Desafio 4: o porteiro e os túneis SSM</text>

  <!-- blocked direct access -->
  <path d="M130,170 L130,70 L840,70 L840,120" fill="none" stroke="#B42318" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#aRed)"/>
  <text x="150" y="62" font-size="13" font-weight="bold" fill="#B42318">✕ acesso direto bloqueado: o RDS não tem IP público e fica em subnet privada</text>

  <!-- PC -->
  <rect x="20" y="170" width="230" height="200" fill="#FFFFFF" stroke="#7D8998" stroke-width="1.5"/>
  <text x="36" y="196" font-size="15" font-weight="bold" fill="#232F3E">Seu PC (WSL)</text>
  <rect x="36" y="214" width="198" height="60" fill="#EAF1FB" stroke="#1F5FA8"/>
  <text x="48" y="238" font-size="14" font-weight="bold" fill="#123E73">localhost:5433</text>
  <text x="48" y="258" font-size="12" fill="#3B4450">psql grava um registro</text>
  <rect x="36" y="290" width="198" height="60" fill="#FAF0FB" stroke="#A21CAF"/>
  <text x="48" y="314" font-size="14" font-weight="bold" fill="#7A1683">localhost:3002</text>
  <text x="48" y="334" font-size="12" fill="#3B4450">navegador / curl na BIA</text>

  <!-- Session Manager -->
  <rect x="300" y="226" width="160" height="90" fill="#FFFFFF" stroke="#7D8998" stroke-width="1.5"/>
  <text x="380" y="254" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">AWS Session</text>
  <text x="380" y="272" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Manager (SSM)</text>
  <text x="380" y="296" font-size="12" fill="#3B4450" text-anchor="middle">IAM confere a permissão</text>

  <path d="M234,244 L296,256" fill="none" stroke="#1F5FA8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <path d="M234,320 L296,290" fill="none" stroke="#A21CAF" stroke-width="2.5" marker-end="url(#aPurple)"/>

  <!-- VPC -->
  <rect x="490" y="100" width="450" height="380" fill="#F7F9FB" stroke="#3334B9" stroke-width="2"/>
  <text x="506" y="124" font-size="14" font-weight="bold" fill="#3334B9">VPC bia-vpc</text>

  <!-- Porteiro -->
  <rect x="520" y="200" width="170" height="140" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
  <text x="605" y="226" font-size="15" font-weight="bold" fill="#232F3E" text-anchor="middle">EC2 porteiro</text>
  <text x="605" y="246" font-size="12" fill="#3B4450" text-anchor="middle">subnet pública 1b</text>
  <text x="605" y="268" font-size="12" fill="#3B4450" text-anchor="middle">agente SSM + role</text>
  <rect x="534" y="282" width="142" height="44" fill="#E6F6F7" stroke="#00A4A6" stroke-dasharray="4,3"/>
  <text x="605" y="300" font-size="12" font-weight="bold" fill="#005F61" text-anchor="middle">SG bia-porteiro:</text>
  <text x="605" y="317" font-size="12" font-weight="bold" fill="#005F61" text-anchor="middle">0 portas de entrada</text>

  <path d="M520,270 L464,270" fill="none" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="492" y="352" font-size="12" fill="#1B5E20" text-anchor="middle">o agente liga</text>
  <text x="492" y="368" font-size="12" fill="#1B5E20" text-anchor="middle">para a AWS (443)</text>
  <path d="M492,342 L492,278" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- RDS -->
  <rect x="750" y="124" width="170" height="110" fill="#EAF1FB" stroke="#1F5FA8" stroke-width="1.5"/>
  <text x="835" y="150" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">RDS bia :5432</text>
  <text x="835" y="170" font-size="12" fill="#3B4450" text-anchor="middle">subnet privada</text>
  <text x="835" y="190" font-size="12" fill="#3B4450" text-anchor="middle">SG bia-db aceita</text>
  <text x="835" y="208" font-size="12" fill="#3B4450" text-anchor="middle">"vindo de bia-porteiro"</text>

  <!-- ECS EC2 -->
  <rect x="750" y="330" width="170" height="110" fill="#FFF4E8" stroke="#ED7100" stroke-width="1.5"/>
  <text x="835" y="356" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">EC2 do cluster ECS</text>
  <text x="835" y="376" font-size="12" fill="#3B4450" text-anchor="middle">BIA na porta 80</text>
  <text x="835" y="396" font-size="12" fill="#3B4450" text-anchor="middle">acessada pelo IP privado</text>

  <path d="M690,225 L746,190" fill="none" stroke="#1F5FA8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="712" y="196" font-size="12" fill="#123E73" text-anchor="middle">:5432</text>
  <path d="M690,320 L746,370" fill="none" stroke="#A21CAF" stroke-width="2.5" marker-end="url(#aPurple)"/>
  <text x="712" y="366" font-size="12" fill="#7A1683" text-anchor="middle">:80</text>

  <!-- Legend -->
  <text x="30" y="508" font-size="14" font-weight="bold" fill="#232F3E">Túnel:</text>
  <text x="84" y="508" font-size="14" fill="#232F3E">o que entra em localhost no PC sai "do outro lado", dentro da VPC, pelo porteiro.</text>
  <text x="84" y="526" font-size="14" fill="#232F3E">Nenhuma porta pública é aberta; o túnel só existe enquanto o terminal fica aberto.</text>
  <path d="M30,556 L60,556" fill="none" stroke="#1F5FA8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="68" y="561" font-size="13" fill="#232F3E">túnel do banco (5433 → 5432)</text>
  <path d="M290,556 L320,556" fill="none" stroke="#A21CAF" stroke-width="2.5" marker-end="url(#aPurple)"/>
  <text x="328" y="561" font-size="13" fill="#232F3E">túnel da BIA (3002 → 80)</text>
  <path d="M530,556 L560,556" fill="none" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="568" y="561" font-size="13" fill="#232F3E">saída 443 do agente</text>
  <path d="M730,556 L760,556" fill="none" stroke="#B42318" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#aRed)"/>
  <text x="768" y="561" font-size="13" fill="#232F3E">bloqueado</text>
</svg>
