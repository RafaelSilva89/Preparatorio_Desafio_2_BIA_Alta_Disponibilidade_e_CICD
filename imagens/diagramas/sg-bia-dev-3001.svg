<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" role="img" aria-labelledby="d3sg-t d3sg-d" font-family="Arial,'Helvetica Neue',Helvetica,sans-serif">
<title id="d3sg-t">SG bia-dev: só a porta 3001 entra, a saída é livre</title>
<desc id="d3sg-d">À esquerda, o navegador chega à EC2 bia-dev pela porta 3001, a única liberada pelo SG bia-dev, e cai no container da BIA, que escuta na 8080. Tentativas da internet nas portas 22, 80 e 5432 batem no SG e são bloqueadas. À direita, a saída é livre: a EC2 fala com ECR, GitHub e npm na 443, com o RDS bia na 5432 e com o serviço SSM na 443. Você entra no terminal pelo SSM sem nenhuma porta de entrada, porque é o agente da EC2 que abre a conexão de dentro para fora.</desc>
