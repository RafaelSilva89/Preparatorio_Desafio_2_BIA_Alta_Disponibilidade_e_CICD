<text x="36" y="406" font-size="13" fill="#1E6F45" font-weight="bold">Stateful: a resposta volta sozinha</text>
<text x="36" y="426" font-size="12" fill="#232F3E">A resposta ao navegador sai sem regra extra; o que a EC2 pede lá fora volta sozinho.</text>

<rect x="20" y="462" width="960" height="80" fill="#F5F7FA" stroke="#7D8998" stroke-width="1"/>
<text x="36" y="486" font-size="14" fill="#232F3E" font-weight="bold">Regra de ouro do Security Group</text>
<text x="36" y="510" font-size="13" fill="#232F3E">Entrada: tudo fechado por padrão. Só passa o que uma regra libera (aqui, só TCP 3001 de 0.0.0.0/0).</text>
<text x="36" y="530" font-size="13" fill="#232F3E">Saída: liberada. Por isso o terminal (SSM), o git, o docker pull e o banco funcionam sem abrir porta de entrada.</text>
